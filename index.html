 const t=document.createElement("div");t.textContent=`Status: ${s.state||"no run yet"}${o.inMeeting?" (in meeting room)":""}\nModel: ${(s.model||"-").replace(":free","")}\nTask: ${s.task||"-"}\nLast run: ${s.at||"-"}\n\n${s.preview||""}`;panel.appendChild(t);
 const a=document.createElement("a");a.href=`https://t.me/${BOT}?start=talk_${o.a.id}`;a.target="_blank";a.rel="noopener";a.textContent=`💬 Talk to ${o.a.name} on Telegram`;a.className="talk";panel.appendChild(a)}
// movement
const AISLE=0,MEET_SEATS=[[7,-1.5],[8.2,-1.5],[9.4,-1.5],[7,1.5],[8.2,1.5],[9.4,1.5],[10.4,-1.5],[10.4,1.5]];
function V(x,z){return new THREE.Vector3(x,0,z)}
function goTo(o,pts,after,face){o.path=pts;o.after=after;o.faceTo=face||null;o.mode="walk"}
function pathTo(o,tx,tz){const p=[];const c=o.pos;if(c.x>5.0&&tx<5.0){p.push(V(5.4,c.z),V(5.4,AISLE))}else if(c.x>5.0&&tx>5.0){p.push(V(5.4,c.z))}
 if(tx>5.0){if(c.x<5.0){if(Math.abs(c.z-AISLE)>0.3)p.push(V(c.x,AISLE));p.push(V(5.4,AISLE),V(5.4,tz))}p.push(V(tx,tz))}
 else{if(Math.abs(c.z-AISLE)>0.3||p.length===0)p.push(V(p.length?5.4:c.x,AISLE));p.push(V(tx,AISLE),V(tx,tz))}
 return p}
function sendHome(o){const h=o.home;const p=pathTo(o,h.x,h.z);goTo(o,p,"sit")}
function sendMeeting(o,k){const t=MEET_SEATS[k%MEET_SEATS.length];goTo(o,pathTo(o,t[0],t[1]),"stand",V(8.2,0));o.inMeeting=true}
let pairBusy=null;
function maybePair(t){if(pairBusy)return;const free=ids.filter(i=>!objs[i].a.od&&objs[i].mode==="seated"&&!objs[i].inMeeting&&objs[i].greet<=0);if(free.length<2)return;
 const a=free[Math.floor(Math.random()*free.length)];let b=a;while(b===a)b=free[Math.floor(Math.random()*free.length)];
 const A=objs[a],B=objs[b];pairBusy={a:A,b:B,t:0,stage:"go"};
 goTo(A,pathTo(A,-8.2,AISLE),"stand",V(-7.1,0));goTo(B,pathTo(B,-7.1,AISLE),"stand",V(-8.2,0))}
function normA(x){while(x>Math.PI)x-=2*Math.PI;while(x<-Math.PI)x+=2*Math.PI;return x}
const clock=new THREE.Clock();let nextPair=6;let T=0;
function animate(){const dt=Math.min(clock.getDelta(),0.05);T+=dt;
 nextPair-=dt;if(nextPair<=0&&!pairBusy){maybePair();nextPair=16+Math.random()*14}
 if(pairBusy){const p=pairBusy;if(p.stage==="go"&&p.a.mode==="stand"&&p.b.mode==="stand"){p.stage="chat";p.t=0;p.a.gest=1;p.b.gest=1}
  else if(p.stage==="chat"){p.t+=dt;if(p.t>9){p.a.gest=0;p.b.gest=0;sendHome(p.a);sendHome(p.b);p.stage="back"}}
  else if(p.stage==="back"&&p.a.mode==="seated"&&p.b.mode==="seated")pairBusy=null}
 for(const id of ids){const o=objs[id],f=o.f;
  if(o.greet>0){o.greet-=dt;if(o.greet<=0)o.bub.visible=false}
  let moving=false;
  if(o.mode==="walk"&&o.greet<=0){const tg=o.path[0];if(!tg){o.mode=o.after==="sit"?"seated":"stand";if(o.mode==="seated"){o.pos.copy(o.home)}else if(o.faceTo){o.faceYaw=Math.atan2(o.faceTo.x-o.pos.x,o.faceTo.z-o.pos.z)}}
   else{const dx=tg.x-o.pos.x,dz=tg.z-o.pos.z,dist=Math.hypot(dx,dz);if(dist<0.08){o.pos.copy(tg);o.path.shift()}else{const sp=Math.min(dist,1.9*dt);o.pos.x+=dx/dist*sp;o.pos.z+=dz/dist*sp;o.heading=Math.atan2(dx,dz);moving=true}}}
  const sitT=o.mode==="seated"?1:0;o.sit+=(sitT-o.sit)*Math.min(1,dt*6);
  let want;if(o.greet>0){want=Math.atan2(cam.position.x-o.pos.x,cam.position.z-o.pos.z)}else if(moving)want=o.heading;else if(o.mode==="seated")want=o.seatYaw;else want=o.faceYaw;
  o.yaw+=normA(want-o.yaw)*Math.min(1,dt*(moving?9:6));
  f.root.position.copy(o.pos);f.root.rotation.y=o.yaw;
  const s=o.sit;f.hips.position.y=0.9-0.38*s;
  const sw=moving?Math.sin(T*8+o.ph)*0.7:0;
  f.lL.t.rotation.x=-Math.PI/2*s+sw*(1-s);f.lR.t.rotation.x=-Math.PI/2*s-sw*(1-s);f.lL.s.rotation.x=Math.PI/2*s;f.lR.s.rotation.x=Math.PI/2*s;
  // arms
  let uL=0,uR=0,fL=0,fR=0,hy=0,hx=0;const ph=T+o.ph;
  if(o.mode==="seated"&&o.greet<=0){const k=Math.sin(ph*13)*0.06,k2=Math.sin(ph*11+1)*0.06;uL=-0.9*s+k;uR=-0.9*s+k2;fL=-1.0*s+k2;fR=-1.0*s+k;hy=Math.sin(ph*0.5)*0.35;hx=Math.sin(ph*1.3)*0.05}
  else if(moving){uL=-sw*0.8;uR=sw*0.8;fL=-0.2;fR=-0.2}
  else if(o.mode==="stand"&&o.gest&&o.greet<=0){const a1=Math.sin(ph*2.2)>0;uR=a1?-1.1:-0.5;fR=-0.9+Math.sin(ph*6)*0.2;uL=-0.2;fL=-0.3;hy=Math.sin(ph*1.6)*0.25}
  else if(o.mode==="stand"&&o.inMeeting){uL=-0.3;uR=-0.4+Math.sin(ph*1.5)*0.2;fR=-0.6;fL=-0.4;hy=Math.sin(ph*0.9)*0.3}
  f.aL.u.rotation.set(uL,0,0.05);f.aL.f.rotation.set(fL,0,0);f.aR.u.rotation.set(uR,0,-0.05);f.aR.f.rotation.set(fR,0,0);
  if(o.greet>0){f.aR.u.rotation.set(-Math.PI+0.3,0,Math.sin(T*9)*0.45);f.aR.f.rotation.set(-0.3,0,0);hy=0;f.head.rotation.x=-0.05}
  f.head.rotation.y=hy;if(o.greet<=0)f.head.rotation.x=hx;
  const top=o.mode==="seated"?1.95:2.3;o.L.position.set(o.pos.x,top+0.35,o.pos.z);o.dot.position.set(o.pos.x+1.45,top+0.35,o.pos.z);o.bub.position.set(o.pos.x,top+1.55,o.pos.z)}
 ctl.update();renderer.render(scene,cam);requestAnimationFrame(animate)}
async function load(){try{const r=await fetch("state/status.json?"+Date.now());const d=await r.json();
 document.getElementById("upd").textContent=d.updated?"Last update: "+new Date(d.updated).toLocaleString("en-GB"):"no run yet";
 const A=d.agents||{};const qa=A.qa||{};const flagged=Array.isArray(qa.flagged)?qa.flagged:[];
 const meet=new Set(flagged.length?["qa","manager",...flagged]:[]);let k=0;
 for(const a of AG){const o=objs[a.id];const s=A[a.id];o.st=s||null;const state=s?(s.state==="working"?"working":s.state==="done"?"done":"failed"):"idle";
  a.scr.material.color.setHex(COL[state]);o.dot.material.color.setHex(COL[state]);
  const wasMeet=o.inMeeting;const nowMeet=meet.has(a.id);
  if(nowMeet&&!wasMeet){if(pairBusy&&(pairBusy.a===o||pairBusy.b===o)){pairBusy.a.gest=0;pairBusy.b.gest=0;pairBusy=null}sendMeeting(o,k)}
  else if(!nowMeet&&wasMeet){o.inMeeting=false;sendHome(o)}
  if(nowMeet)k++}
 }catch(e){document.getElementById("upd").textContent="status unavailable"}}
load();setInterval(load,60000);
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
window.__office={objs,greet,maybePair};
animate();
</script></body></html>
