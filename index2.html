<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rawaj Global Office</title>
<style>
html,body{margin:0;height:100%;background:#12161f;color:#e8ecf3;font-family:system-ui,sans-serif;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:#1d2a44cc;display:flex;justify-content:space-between;font-size:13px;z-index:2}
#panel{position:fixed;left:8px;right:8px;bottom:8px;background:#1d2a44ee;border-radius:10px;padding:10px 12px;font-size:13px;display:none;max-height:38%;overflow:auto;z-index:2;white-space:pre-wrap}
#panel b{font-size:15px}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
#legend{position:fixed;right:8px;top:40px;font-size:12px;background:#1d2a44cc;border-radius:8px;padding:6px 8px;z-index:2}
.d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="top"><span>Rawaj Global Office</span><span id="upd">loading...</span></div>
<div id="legend"><div><span class="d" style="background:#2ecc71"></span>done</div><div><span class="d" style="background:#e74c3c"></span>failed</div><div><span class="d" style="background:#f1c40f"></span>working</div><div><span class="d" style="background:#7f8c8d"></span>no run yet</div></div>
<div id="panel"></div><div id="msg">Your browser cannot show the 3D office (WebGL is off). The latest status is in the file state/status.json.</div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
const AG0=[
 {id:"manager",n:"Manager",c:0x8e44ad},{id:"research",n:"Research",c:0x2980b9},{id:"content",n:"Content AR/EN",c:0xe67e22},
 {id:"design",n:"Design Brief",c:0xe84393},{id:"scheduling",n:"Scheduling",c:0x16a085},{id:"client_success",n:"Client Success",c:0x27ae60},
 {id:"lead_research",n:"Lead Research",c:0xc0392b},{id:"qa",n:"QA",c:0x95a5a6}];
const TITLES={manager:["Omar","Operations Manager"],research:["Layla","Market Research Analyst"],content:["Yousef","Content Lead (AR/EN)"],design:["Nour","Design Brief Specialist"],scheduling:["Karim","Scheduling Coordinator"],client_success:["Hala","Client Success Manager"],lead_research:["Tariq","Lead Research Specialist"],qa:["Mariam","QA Lead"]};
const AG=AG0.map(a=>({...a,n:TITLES[a.id][0]+" · "+TITLES[a.id][1]}));
const COL={done:0x2ecc71,failed:0xe74c3c,working:0xf1c40f,idle:0x7f8c8d};
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"low-power"});}catch(e){document.getElementById("msg").style.display="flex";throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x12161f);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);cam.position.set(0,13,15);
const ctl=new OrbitControls(cam,renderer.domElement);ctl.target.set(1.5,0,0);ctl.maxPolarAngle=1.35;ctl.minDistance=6;ctl.maxDistance=30;ctl.enablePan=false;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(5,12,6);scene.add(sun);
const M=(c)=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,p=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);p.add(m);return m}
box(22,0.2,14,0xd9c8a0,1,-0.1,0);            // office floor
box(7,0.22,8,0x5d6d7e,8.2,-0.09,0);           // meeting room floor
[[-3.6,-6.9,13,0.2],[8.2,-6.9,7,0.2],[-3.6,6.9,13,0.2],[8.2,6.9,7,0.2]].forEach(a=>box(a[2],1.6,a[3],0x8a7a5a,a[0],0.8,a[1]));
box(0.2,1.6,13.8,0x8a7a5a,-10,0.8,0);box(0.2,1.6,13.8,0x8a7a5a,11.7,0.8,0);box(0.2,1.6,3,0x8a7a5a,4.7,0.8,-5.4);box(0.2,1.6,3,0x8a7a5a,4.7,0.8,5.4);
box(3.2,0.15,1.6,0x6e4b2a,8.2,1,0);for(let i=0;i<4;i++){box(0.1,0.9,0.1,0x4a3320,7+i*0.8,0.5,0.6)}
function label(text,color="#fff",w=3.2){const c=document.createElement("canvas");c.width=512;c.height=96;const g=c.getContext("2d");g.fillStyle="#000a";g.fillRect(0,0,512,96);g.fillStyle=color;let fs=44;g.font="bold "+fs+"px sans-serif";while(g.measureText(text).width>480&&fs>18){fs-=2;g.font="bold "+fs+"px sans-serif"}g.textAlign="center";g.textBaseline="middle";g.fillText(text,256,50);
 const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));s.scale.set(w,w*96/512,1);s.renderOrder=5;return s}
const sp=label("MEETING ROOM","#f5cba7",3.4);sp.position.set(8.2,2.6,-3.6);scene.add(sp);
const desks={},seats=[[7,0,-1.6],[9.4,0,-1.6],[7,0,1.6],[9.4,0,1.6],[6.1,0,0],[10.3,0,0],[8.2,0,-2.4],[8.2,0,2.4]];
const home=[];AG.forEach((a,i)=>{const col=i%4,row=Math.floor(i/4);home.push([-8+col*4.2,0,-3+row*5.2]);});
const objs={};
AG.forEach((a,i)=>{const [x,,z]=home[i];const g=new THREE.Group();scene.add(g);
 box(2.4,0.12,1.2,0x7d5a3a,x,0.9,z-0.4,g);box(0.12,0.9,0.12,0x4a3320,x-1,0.45,z-0.8,g);box(0.12,0.9,0.12,0x4a3320,x+1,0.45,z-0.8,g);
 const mon=box(0.9,0.6,0.08,0x111111,x,1.35,z-0.8,g);const scr=box(0.8,0.5,0.02,COL.idle,x,1.35,z-0.75,g);scr.material=new THREE.MeshBasicMaterial({color:COL.idle});
 const p=new THREE.Group();p.position.set(x,0,z+0.6);g.add(p);
 box(0.6,0.8,0.4,a.c,0,0.9,0,p);const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,8),M(0xf0c8a0));head.position.set(0,1.55,0);p.add(head);
 const L=label(a.n,"#fff",3.4);L.position.set(x,2.5,z);g.add(L);
 const dot=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,6),new THREE.MeshBasicMaterial({color:COL.idle}));dot.position.set(x+1.1,2.5,z);g.add(dot);
 objs[a.id]={g,p,scr,dot,home:new THREE.Vector3(x,0,z+0.6),target:new THREE.Vector3(x,0,z+0.6),a,st:null,hit:[p.children[0],p.children[1],scr]};});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),panel=document.getElementById("panel");
function pick(e){const r=renderer.domElement.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,cam);
 const all=Object.values(objs).flatMap(o=>o.hit);const h=ray.intersectObjects(all)[0];if(!h){panel.style.display="none";return}
 const o=Object.values(objs).find(o=>o.hit.includes(h.object));show(o)}
let down=null;renderer.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener("pointerup",e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<6)pick(e)});
function show(o){const s=o.st||{};panel.style.display="block";panel.innerHTML=`<b>${o.a.n}</b>\nStatus: ${s.state||"no run yet"}${o.inMeeting?" (in meeting room)":""}\nModel: ${(s.model||"-").replace(":free","")}\nTask: ${s.task||"-"}\nLast run: ${s.at||"-"}\n\n${s.preview||""}`}
async function load(){try{const r=await fetch("state/status.json?"+Date.now());const d=await r.json();
 document.getElementById("upd").textContent=d.updated?"Last update: "+new Date(d.updated).toLocaleString("en-GB"):"no run yet";
 const A=d.agents||{};const qa=A.qa||{};const flagged=Array.isArray(qa.flagged)?qa.flagged:[];
 const meet=new Set(flagged.length?["qa","manager",...flagged]:[]);let k=0;
 for(const a of AG){const o=objs[a.id];const s=A[a.id];o.st=s||null;const state=s?(s.state==="working"?"working":s.state==="done"?"done":"failed"):"idle";
  o.scr.material.color.setHex(COL[state]);o.dot.material.color.setHex(COL[state]);
  o.inMeeting=meet.has(a.id);if(o.inMeeting){const t=seats[k++%seats.length];o.target.set(t[0],0,t[2])}else o.target.copy(o.home);}
 }catch(e){document.getElementById("upd").textContent="status unavailable"}}
load();setInterval(load,60000);
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){for(const o of Object.values(objs)){o.p.position.lerp(o.target.clone().sub(o.g.position),0.06)}ctl.update();renderer.render(scene,cam);requestAnimationFrame(loop)}
loop();
</script></body></html>
