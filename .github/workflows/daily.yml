name: rawaj-daily
on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "10 6 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agents and send report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: out/
          if-no-files-found: ignore
      - name: Save state
        run: |
          git config user.name rawaj-bot
          git config user.email rawaj-bot@users.noreply.github.com
          git add state
          git commit -m "daily run" || echo "nothing to commit"
          git push
