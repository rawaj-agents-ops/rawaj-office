name: rawaj-chat
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: rawaj-chat
  cancel-in-progress: false
jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: chatcache
          key: chat-none
          restore-keys: chat-
      - name: Answer pending chat messages
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python chat.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: chatcache
          key: chat-${{ github.run_id }}
